name: Build RotateUV Feature-Aware Auto Seam V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Rotate_UV_PRO_NATIVE_AUTO_SEAM_V1.ms'
      - 'Rotate_UV_PRO_NATIVE_AUTO_SEAM_V1.mcr'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build feature-aware worker
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /O2 /DNDEBUG /std:c++17 /EHsc /MD src\autoseam_worker.cpp /Fe:dist\RotateUV_AutoSeam.exe

      - name: Smoke test worker
        shell: pwsh
        run: |
          & 'dist\RotateUV_AutoSeam.exe'
          $code = $LASTEXITCODE
          if ($code -ne 2) { throw "Expected usage exit code 2, got $code" }
          exit 0

      - name: Copy MaxScript files
        shell: pwsh
        run: |
          Copy-Item Rotate_UV_PRO_NATIVE_AUTO_SEAM_V1.ms dist\ -Force
          Copy-Item Rotate_UV_PRO_NATIVE_AUTO_SEAM_V1.mcr dist\ -Force

      - name: Upload ready-to-use Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RotateUV-Feature-Aware-Auto-Seam-V2-Windows
          path: dist/*
          if-no-files-found: error

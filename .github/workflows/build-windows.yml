name: Build RotateUV Native Auto Seam + Unfold V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Rotate_UV_PRO_NATIVE_UNFOLD_V1.ms'
      - 'Rotate_UV_PRO_NATIVE_UNFOLD_V1.mcr'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Auto Seam worker
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /O2 /DNDEBUG /std:c++17 /EHsc /MD src\autoseam_worker.cpp /Fe:dist\RotateUV_AutoSeam.exe

      - name: Build Native Unfold worker
        shell: cmd
        run: |
          cl /nologo /O2 /DNDEBUG /std:c++17 /EHsc /MD src\unfold_worker.cpp /Fe:dist\RotateUV_Unfold.exe

      - name: Smoke test workers
        shell: pwsh
        run: |
          & 'dist\RotateUV_AutoSeam.exe'
          $seamCode = $LASTEXITCODE
          if ($seamCode -ne 2) { throw "Auto Seam worker usage test failed: $seamCode" }

          & 'dist\RotateUV_Unfold.exe'
          $unfoldCode = $LASTEXITCODE
          if ($unfoldCode -ne 2) { throw "Native Unfold worker usage test failed: $unfoldCode" }

          exit 0

      - name: Copy MaxScript
        shell: pwsh
        run: |
          Copy-Item Rotate_UV_PRO_NATIVE_UNFOLD_V1.ms dist\ -Force
          Copy-Item Rotate_UV_PRO_NATIVE_UNFOLD_V1.mcr dist\ -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RotateUV-Native-Unfold-V1-Windows
          path: dist/*
          if-no-files-found: error
